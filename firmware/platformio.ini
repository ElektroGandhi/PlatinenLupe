; Platinenlupe firmware — two boards connected by four wires (TX, RX, GND, 5 V) (see docs/hardware.md).
;
;   pio run -e loupe_side -t upload          ESP32 (any classic ESP32 DevKit / WROOM-32) — talks to the loupe
;   pio run -e home_side_esp8266 -t upload   NodeMCU v3 / ESP8266 — serves your browser
;   pio run -e home_side_esp32 -t upload     …or a second ESP32 as the home side
;
; The home side embeds ../web/index.html (gzip) at build time: scripts/embed_page.py.

[platformio]
default_envs = loupe_side, home_side_esp8266, home_side_esp32

[env]
framework = arduino
monitor_speed = 115200
; 1 Mbaud, not 2: with the loupe at −70 dBm the ESP32 retransmits a lot, and at 2 Mbaud nearly every frame
; arrived broken at the ESP8266 (753 CRC errors in 10 min, 0 frames after 30 s). ~100 KB/s is plenty for 5 frames/s.
build_flags = -DLINK_BAUD=1000000

[esp32]
platform = espressif32@6.10.0
board = esp32dev
board_build.partitions = huge_app.csv

[env:loupe_side]
extends = esp32
build_src_filter = +<loupe_side/>
lib_deps = h2zero/NimBLE-Arduino@1.4.3

[env:home_side_esp32]
extends = esp32
build_src_filter = +<home_side/>
extra_scripts = pre:scripts/embed_page.py

[env:home_side_esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
board_build.f_cpu = 160000000L   ; 160 MHz: the UART reader keeps up at higher link rates
; lwIP with 1460-byte segments: the default (536, 1072 B in flight) stalled the stream to ~1 KB per 40 ms
build_flags = ${env.build_flags} -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
build_src_filter = +<home_side/>
extra_scripts = pre:scripts/embed_page.py
