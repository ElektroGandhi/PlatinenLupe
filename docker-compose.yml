# Platinenlupe server: live image in the browser + part identification with a local vision model.
#   docker compose up -d        then open http://<this-host>:8080
#
# network_mode host: the home-side board announces itself by UDP broadcast (port 61499), and broadcasts do not
# cross Docker's bridge network. Alternative: a macvlan network, or set PL_DEVICE_IP to the board's address.
services:
  platinenlupe:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: platinenlupe:1.0.0
    container_name: platinenlupe
    network_mode: host
    restart: unless-stopped
    environment:
      - PL_PORT=8080
      # Your model server (LM Studio, Ollama or any OpenAI-compatible server). See docs/identification.md.
      - PL_VLM_URL=http://127.0.0.1:1234
      # - PL_VLM_MODEL=gemma3:12b       # required for Ollama / OpenAI-compatible; LM Studio uses the loaded model
      # - PL_VLM_API_KEY=               # only if your model server wants one
      # - PL_DEVICE_IP=192.168.1.50     # only if the broadcast does not arrive
      # - PL_IDENTIFY=0                 # viewer only, no identification
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m]
