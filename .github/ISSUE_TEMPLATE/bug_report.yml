name: Something does not work
description: The picture stalls, a board does not boot, the page misbehaves
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Numbers help most: the JSON from `http://<board>/api/state` says nearly everything about the link.
        Please remove your WiFi name from it if you do not want to share it.
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Hotspot, Home network]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: shown on the settings page and as `firmware` in /api/state
      placeholder: "1.3.0"
    validations: { required: true }
  - type: input
    id: boards
    attributes:
      label: Boards
      placeholder: "ESP32 DevKit V1 (loupe side) + NodeMCU v3 (home side)"
  - type: input
    id: loupe
    attributes:
      label: Loupe model
      description: name of its WiFi and the app it came with, if you know them
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: state
    attributes:
      label: /api/state (optional)
      render: json
