name: ci
on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: UART framing test (host)
        run: g++ -std=c++17 -Wall -Werror -Ifirmware/include firmware/test/frame_test.cpp -o frame_test && ./frame_test
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: sh firmware/scripts/build_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: flasher/firmware/*.bin
